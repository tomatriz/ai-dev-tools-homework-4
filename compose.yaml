name: order-tracker

services:
  app:
    image: order-tracker:${ORDER_TRACKER_TAG:-local}
    build: .
    ports:
      - "127.0.0.1:${ORDER_TRACKER_PORT:-8000}:8000"
    environment:
      ORDER_DB_PATH: /data/orders.db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - orders:/data
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12

  incident-response:
    build: ./incident-response
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      INCIDENT_DIR: /incidents
      INCIDENT_AGENT_COMMAND: ${INCIDENT_AGENT_COMMAND:-}
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
    volumes:
      - ./incidents:/incidents
      - .:/workspace
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [loki, tempo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo, incident-response]
    restart: unless-stopped

volumes:
  orders:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${ORDER_TRACKER_SUBNET:-10.215.24.0/24}
