apiVersion: 1
groups:
  - orgId: 1
    name: order-tracker-alerts
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: Order Tracker 5xx responses
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              editorMode: code
              expr: sum by (http_route) (increase(http_server_requests_total{http_response_status_code=~"5.."}[1m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 5xx responses detected for {{ $labels.http_route }}
          endpoint: '{{ $labels.http_route }}'
          time_window: 1 minute
          dashboard_url: http://localhost:3000/d/order-tracker/order-tracker
        labels:
          severity: critical
          service: order-tracker
