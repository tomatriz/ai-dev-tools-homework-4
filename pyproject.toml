[project]
name = "order-tracker"
version = "0.2.0"
description = "Observable order tracker with automated incident response"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests", "incident-response/tests"]
pythonpath = [".", "incident-response"]
