<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Tracker</title>
<style>
  :root { font-family: system-ui, sans-serif; color: #172b3a; background: #f4f7f8; }
  body { max-width: 850px; margin: 3rem auto; padding: 0 1rem; }
  form, article { background: white; border: 1px solid #dce4e9; border-radius: 10px; padding: 1rem; }
  form { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.5rem 0; }
  input, select, button { font: inherit; padding: .6rem; border-radius: 6px; border: 1px solid #aebec8; }
  button { background: #175f72; color: white; cursor: pointer; }
  #orders { display: grid; gap: .7rem; }
  article { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
  .error { color: #ac2525; }
</style>
<h1>Order Tracker</h1>
<p>Create an order, then open it to check its current status.</p>
<form id="new-order"><input name="customer" placeholder="Customer" required><input name="item" placeholder="Item" required><select name="priority"><option>standard</option><option>express</option></select><button>Create order</button></form>
<div id="detail" role="status"></div><div id="orders"></div>
<script>
const ordersEl=document.querySelector('#orders'),detailEl=document.querySelector('#detail');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadOrders(){const r=await fetch('/api/orders'),orders=await r.json();ordersEl.innerHTML=orders.map(o=>`<article><span><strong>${esc(o.item)}</strong> for ${esc(o.customer)} · ${esc(o.priority)} · ${esc(o.status)}</span><button data-id="${esc(o.id)}">Check status</button></article>`).join('')}
ordersEl.addEventListener('click',async e=>{const id=e.target.dataset.id;if(!id)return;const r=await fetch('/api/orders/'+encodeURIComponent(id));if(!r.ok){detailEl.className='error';detailEl.textContent='Could not check this order ('+r.status+').';return}const o=await r.json();detailEl.className='';detailEl.textContent=o.item+' for '+o.customer+': '+o.status+(o.estimated_delivery?' · estimated delivery '+o.estimated_delivery:'')});
document.querySelector('#new-order').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(r.ok){e.target.reset();await loadOrders()}});loadOrders();
</script>
</html>
